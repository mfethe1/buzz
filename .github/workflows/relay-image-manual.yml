name: Relay Image (manual fork build)

# Push-triggered on a dedicated branch namespace so it runs on NATIVE amd64
# runners without depending on the product/main PR queue or the qualify gate.
on:
  push:
    branches:
      - "ci/relay-image/**"

permissions:
  contents: read
  packages: write

jobs:
  build-relay:
    name: Build relay image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            BUZZ_SOURCE_SHA=${{ github.sha }}
            BUZZ_BUILD_ID=fork-relay-${{ github.run_id }}
            BUZZ_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/buzz:relay-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/buzz:relay-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report pushed tags
        run: |
          echo "Pushed ghcr.io/${{ github.repository_owner }}/buzz:relay-${{ github.sha }}"
          echo "Pushed ghcr.io/${{ github.repository_owner }}/buzz:relay-latest"
