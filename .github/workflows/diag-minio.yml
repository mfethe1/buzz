name: diag-minio
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Start minio only
        run: docker compose up -d minio || true
      - name: Probe
        run: |
          sleep 15
          echo "=== ls /bin"; docker exec buzz-minio ls /bin /usr/bin 2>&1 | head -40
          echo "=== minio help"; docker exec buzz-minio minio --help 2>&1 | head -40
          echo "=== minio ready"; docker exec buzz-minio minio ready local 2>&1; echo "minio ready exit: $?"
