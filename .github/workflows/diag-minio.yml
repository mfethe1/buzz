name: diag-minio
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Start minio only
        run: docker compose up -d minio || true
      - name: Probe
        run: |
          sleep 15
          echo "=== bash /dev/tcp healthcheck"
          docker exec buzz-minio bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && head -n1 <&3 | grep -q "200"'; echo "devtcp exit: $?"
          echo "=== minio-init smoke (full lifecycle)"
          docker compose up -d minio-init || true
          sleep 5
          docker logs buzz-minio-init 2>&1 | tail -8
